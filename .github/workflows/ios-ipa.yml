name: Build iOS IPA (unsigned)

# Builds an unsigned .ipa on a GitHub macOS runner.
# Sideloading tools (SideStore / Sideloadly) sign it with your Apple ID when you install it.
# Run it from the repo's Actions tab: "Build iOS IPA (unsigned)" -> "Run workflow".

on:
  workflow_dispatch:

jobs:
  build:
    # Expo SDK 58 needs Xcode 26.4 or newer. The macos-26 image ships 26.4+ as default.
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Check Xcode version (needs 26.4+)
        run: |
          echo "Installed Xcodes:"
          ls -d /Applications/Xcode*.app || true
          xcodebuild -version
          swift --version
          ver=$(xcodebuild -version | head -n1 | awk '{print $2}')
          major=${ver%%.*}
          rest=${ver#*.}
          minor=${rest%%.*}
          [ "$minor" = "$ver" ] && minor=0
          if [ "$major" -lt 26 ] || { [ "$major" -eq 26 ] && [ "$minor" -lt 4 ]; }; then
            echo "::error::Xcode $ver is too old for Expo SDK 58 (needs 26.4+)."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Generate native iOS project
        run: npx expo prebuild --platform ios --no-install

      - name: Install CocoaPods
        run: cd ios && pod install

      - name: Archive (unsigned)
        run: |
          mkdir -p build
          set +e
          xcodebuild archive \
            -workspace ios/SymptomTracker.xcworkspace \
            -scheme SymptomTracker \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath build/App.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            > build/xcodebuild.log 2>&1
          status=$?
          if [ $status -ne 0 ]; then
            echo "===== ERROR LINES ====="
            grep -n -B2 -A8 " error: \|^error: \|fatal error:\|\*\* .* FAILED \*\*" build/xcodebuild.log | head -n 150
            echo "===== LAST 40 LINES ====="
            tail -n 40 build/xcodebuild.log
          fi
          exit $status

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: build/xcodebuild.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/App.xcarchive/Products/Applications/*.app Payload/
          zip -qr SymDoc.ipa Payload
          ls -lh SymDoc.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: SymDoc-ipa
          path: SymDoc.ipa
          retention-days: 14
