name: Build iOS IPA (unsigned)

# Builds an unsigned .ipa on a free GitHub macOS runner.
# Sideloading tools (SideStore / Sideloadly) sign it with your Apple ID when you install it.
# Run it from the repo's Actions tab: "Build iOS IPA (unsigned)" -> "Run workflow".

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Generate native iOS project
        run: npx expo prebuild --platform ios --no-install

      - name: Install CocoaPods
        run: cd ios && pod install

      - name: Archive (unsigned)
        run: |
          mkdir -p build
          set +e
          xcodebuild archive \
            -workspace ios/SymptomTracker.xcworkspace \
            -scheme SymptomTracker \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath build/App.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            > build/xcodebuild.log 2>&1
          status=$?
          if [ $status -ne 0 ]; then
            echo "===== ERROR LINES ====="
            grep -n -i -B2 -A8 "error:\|fatal error\|\*\* .* FAILED\|command .* failed\|No such file" build/xcodebuild.log | head -n 150
            echo "===== LAST 80 LINES BEFORE SUMMARY ====="
            grep -n "ARCHIVE FAILED" build/xcodebuild.log | head -n 1
          fi
          exit $status

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: build/xcodebuild.log
          retention-days: 7

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/App.xcarchive/Products/Applications/*.app Payload/
          zip -qr SymDoc.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: SymDoc-ipa
          path: SymDoc.ipa
          retention-days: 14
